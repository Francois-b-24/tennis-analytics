[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analytics"
version = "0.1.0"
description = "Plateforme d'analytics tennis ATP/WTA : stats, ratings Elo et prédictions ML."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "François B." }]
keywords = ["tennis", "streamlit", "duckdb", "elo", "machine-learning"]
dependencies = [
    "duckdb==2.0.0",
    "joblib==1.6.0",
    "loguru==0.8.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "pandera==0.36.0",
    "plotly==7.1.0",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[project.scripts]
tennis-ingest = "tennis_analytics.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tennis_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "PTH", "RUF", "BLE"]
# E501 : lignes longues tolérées (FR + URLs + SQL inline)
# RUF001 : caractères Unicode "ambigus" (— – ’ é) légitimes dans une app FR
# BLE001 : except Exception toléré côté UI Streamlit
# C408   : dict() littéraux acceptés
ignore = ["BLE001", "C408", "E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"app/Home.py" = ["E402"]
"app/pages/**/*.py" = ["E402"]
"tests/**/*.py" = ["S101"]
"src/tennis_analytics/modeling/win_probability.py" = ["N803", "N806"]

[tool.black]
line-length = 100
target-version = ["py311"]
