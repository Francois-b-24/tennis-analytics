[theme]
primaryColor = "#3A7D44"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7FAF7"
textColor = "#2A2A2A"
font = "sans serif"

[server]
headless = true
# enableCORS retiré : incompatible avec enableXsrfProtection (activé par défaut),
# Streamlit le forçait à true en émettant un warning à chaque démarrage.
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Pas de trace d'erreur détaillée côté navigateur en production (app publique).
showErrorDetails = false
