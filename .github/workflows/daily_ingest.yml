name: Ingestion des données

# Toutes les 3 h : résultats récents (tennis-data + ESPN) fusionnés à l'archive
# Sackmann, Elo et modèle recalculés si les données ont changé, puis publiés
# dans la Release `data-latest` que l'app relit toutes les 15 min.
#
# Les données ne sont plus commitées sur `main` à chaque exécution (le dépôt
# grossissait de plusieurs Mo par commit) : seule une copie de secours est
# commitée au plus une fois par semaine, pour l'app si la Release est
# injoignable.

on:
  schedule:
    # Minute 17 : GitHub retarde fortement les crons lancés à l'heure pile.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Ouvre/referme les issues d'échec et de données périmées.
  issues: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

env:
  RELEASE_TAG: data-latest
  GH_TOKEN: ${{ github.token }}
  ROOT_PATH: ${{ github.workspace }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique nécessaire pour dater la dernière copie de secours.
          fetch-depth: 0

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Récupérer la publication précédente
        run: |
          mkdir -p previous data/state
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -p manifest.json -D previous || true
            gh release download "$RELEASE_TAG" -p 'state-*' -D previous || true
            for f in previous/state-*; do
              [ -e "$f" ] && mv "$f" "data/state/${f#previous/state-}"
            done
          else
            echo "Pas encore de Release $RELEASE_TAG : première publication."
          fi
          ls -la previous data/state

      - name: Collecter les résultats récents
        run: tennis-ingest --state-dir data/state

      - name: Détecter un changement de données
        id: diff
        run: python -m tennis_analytics.publish changed --previous previous/manifest.json

      - name: Recalculer les Elo et le modèle
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m tennis_analytics.transformation.build_elo
          python -m tennis_analytics.transformation.build_model

      # Garde-fous : une ingestion partielle ne doit jamais écraser des données
      # saines (chute de volume > 10 %, dernier match qui recule).
      - name: Contrôles de non-régression et de fraîcheur
        id: check
        run: python -m tennis_analytics.publish check --previous previous/manifest.json

      - name: Vérifier la taille des parquets
        env:
          MAX_PARQUET_BYTES: ${{ vars.MAX_PARQUET_BYTES }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          limit = int(os.environ.get("MAX_PARQUET_BYTES") or "100000000")
          trop = [p for p in Path("data/processed").glob("*.parquet") if p.stat().st_size > limit]
          if trop:
              raise SystemExit(f"Parquets trop volumineux : {trop}")
          print("Tailles OK")
          PY

      - name: Publier dans la Release
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m tennis_analytics.publish manifest
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Données (mise à jour automatique)" \
              --notes "Parquets servis par l'app. Mis à jour par le workflow « Ingestion des données »." \
              --latest=false
          fi
          mkdir -p upload
          for f in data/state/*.parquet; do cp "$f" "upload/state-$(basename "$f")"; done
          # Données d'abord, manifest en dernier : l'app ne voit une nouvelle
          # version qu'une fois tous ses fichiers en ligne (SHA-256 vérifiés).
          gh release upload "$RELEASE_TAG" --clobber \
            data/processed/*.parquet data/processed/models/*.joblib \
            data/processed/metadata.json upload/state-*
          gh release upload "$RELEASE_TAG" --clobber data/processed/manifest.json
          python -c 'import json; print("Publié :", json.load(open("data/processed/manifest.json"))["last_match_date"])'

      - name: Copie de secours hebdomadaire sur main
        if: steps.diff.outputs.changed == 'true'
        run: |
          derniere=$(git log -1 --format=%ct -- data/processed/matches.parquet || echo 0)
          age_jours=$(( ( $(date +%s) - ${derniere:-0} ) / 86400 ))
          echo "Dernière copie de secours : il y a ${age_jours} j"
          if [ "$age_jours" -lt 7 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet data/processed/models/*.joblib data/processed/metadata.json
          git diff --cached --quiet && exit 0
          git commit -m "data: copie de secours hebdomadaire des parquets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Signaler des données périmées
        uses: actions/github-script@v7
        env:
          STALE: ${{ steps.check.outputs.stale }}
        with:
          script: |
            const label = "donnees-perimees";
            const message = process.env.STALE;
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label,
            });
            if (message && ouvertes.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "🟠 Données périmées", labels: [label],
                body: `${message}\n\nLes sources répondent mais ne publient plus de résultats. ` +
                      "Vérifier tennis-data.co.uk et ESPN.\n\n" +
                      "_Cette issue se referme automatiquement au retour de résultats récents._",
              });
            }
            if (!message) {
              for (const issue of ouvertes.data) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed",
                });
              }
            }

      # Sans cette alerte, une ingestion cassée resterait silencieuse.
      - name: Signaler l'échec de l'ingestion
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ingestion-echec",
            });
            if (ouvertes.data.length > 0) {
              console.log("Issue d'échec déjà ouverte, rien à faire.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "🔴 Échec de l'ingestion des données",
              labels: ["ingestion-echec"],
              body: [
                "L'ingestion automatique a échoué : les données ne sont plus à jour.",
                "",
                `- Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "**Causes fréquentes :**",
                "- tennis-data.co.uk et ESPN injoignables en même temps",
                "- Format d'une source modifié (schéma, > 10 % de joueurs inconnus)",
                "- Contrôle de non-régression (chute de volume, dernier match qui recule)",
                "",
                "_Cette issue se referme automatiquement à la prochaine ingestion réussie._",
              ].join("\n"),
            });

      - name: Refermer l'issue d'échec après un succès
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ingestion-echec",
            });
            for (const issue of ouvertes.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: "✅ Ingestion de nouveau fonctionnelle — clôture automatique.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
