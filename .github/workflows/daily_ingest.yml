name: Ingestion quotidienne

on:
  schedule:
    # Tous les jours à 04:00 UTC (06:00 Paris été, 05:00 hiver).
    # Les CSV Sackmann sont mis à jour en fin de journée US — 04:00 UTC = nuit calme.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # Permet d'ouvrir une issue si l'ingestion échoue (cf. dernière étape).
  issues: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nécessaire pour comparer aux parquets précédents et pousser sur main.
          fetch-depth: 0
          persist-credentials: true

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Vérifier l'environnement
        run: |
          python -c "from tennis_analytics.ingestion.sackmann_loader import run_ingestion_pipeline; print('OK')"

      - name: Télécharger, valider et matérialiser
        env:
          ROOT_PATH: ${{ github.workspace }}
        run: tennis-ingest

      - name: Recalculer les Elo et le modèle
        env:
          ROOT_PATH: ${{ github.workspace }}
        run: |
          python -m tennis_analytics.transformation.build_elo
          python -m tennis_analytics.transformation.build_model

      - name: Vérifier la taille des parquets
        env:
          MAX_PARQUET_BYTES: ${{ vars.MAX_PARQUET_BYTES }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          limit = int(os.environ.get("MAX_PARQUET_BYTES") or "100000000")
          failures = []
          for p in Path("data/processed").glob("*.parquet"):
              sz = p.stat().st_size
              if sz > limit:
                  failures.append(f"{p}: {sz} > {limit}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("Tailles OK")
          PY

      # Garde-fou : une ingestion partielle (réseau coupé, source amputée) ne doit
      # jamais écraser des données saines. On refuse toute chute > 10 % du volume.
      - name: Contrôle de non-régression du volume
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import pandas as pd

          seuil = 0.90
          erreurs = []
          for nom in ("matches.parquet", "players.parquet"):
              chemin = Path("data/processed") / nom
              if not chemin.exists():
                  erreurs.append(f"{nom} : absent après ingestion")
                  continue
              nouveau = len(pd.read_parquet(chemin))
              # Version précédente telle que commitée sur main
              try:
                  blob = subprocess.run(
                      ["git", "show", f"HEAD:data/processed/{nom}"],
                      capture_output=True, check=True,
                  ).stdout
              except subprocess.CalledProcessError:
                  print(f"{nom} : pas de version précédente, contrôle ignoré")
                  continue
              ancien_fichier = Path(f"/tmp/prev_{nom}")
              ancien_fichier.write_bytes(blob)
              ancien = len(pd.read_parquet(ancien_fichier))
              print(f"{nom} : {ancien} -> {nouveau} lignes")
              if ancien and nouveau < ancien * seuil:
                  erreurs.append(
                      f"{nom} : chute anormale {ancien} -> {nouveau} "
                      f"(< {seuil:.0%}) — ingestion suspecte"
                  )
          if erreurs:
              print("\n".join(erreurs))
              sys.exit(1)
          print("Volumes cohérents")
          PY

      - name: Commiter directement sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet data/processed/models/*.joblib
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à commiter."
            exit 0
          fi
          git commit -m "data: mise à jour automatique des parquets [skip ci]"
          # Rebase avant push : évite l'échec si un commit est arrivé entre-temps.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Données mises à jour sur main."

      # Sans cette alerte, une ingestion cassée resterait silencieuse : les données
      # se figeraient et il faudrait s'en apercevoir soi-même.
      - name: Signaler l'échec de l'ingestion
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ingestion-echec",
            });
            // Une seule issue ouverte à la fois : pas de spam quotidien.
            if (ouvertes.data.length > 0) {
              console.log("Issue d'échec déjà ouverte, rien à faire.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔴 Échec de l'ingestion quotidienne",
              labels: ["ingestion-echec"],
              body: [
                "L'ingestion automatique a échoué : les données ne sont plus à jour.",
                "",
                `- Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "**Causes fréquentes :**",
                "- Source Sackmann indisponible ou schéma CSV modifié",
                "- Contrôle de non-régression déclenché (chute > 10 % du volume)",
                "- Permissions Actions repassées en lecture seule",
                "",
                "_Cette issue se referme automatiquement à la prochaine ingestion réussie._",
              ].join("\n"),
            });

      - name: Refermer l'issue d'échec après un succès
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ingestion-echec",
            });
            for (const issue of ouvertes.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Ingestion de nouveau fonctionnelle — clôture automatique.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
