name: Maintien des crons

# GitHub désactive automatiquement les workflows planifiés d'un dépôt resté
# ~60 jours sans activité — et le fait silencieusement. L'ingestion quotidienne
# s'arrêterait alors sans prévenir, et il faudrait la réactiver à la main.
#
# Ce workflow réarme le compteur : il vérifie chaque semaine que l'ingestion
# tourne encore, et alerte si elle est muette depuis trop longtemps.

on:
  schedule:
    # Tous les lundis à 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier la fraîcheur de l'ingestion
        uses: actions/github-script@v7
        with:
          script: |
            const SEUIL_HEURES = 48;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "daily_ingest.yml",
              per_page: 10,
            });

            if (runs.data.total_count === 0) {
              core.setFailed("Aucun run d'ingestion trouvé.");
              return;
            }

            const dernier = runs.data.workflow_runs[0];
            const ageHeures = (Date.now() - new Date(dernier.created_at)) / 36e5;
            console.log(
              `Dernier run : ${dernier.conclusion} il y a ${ageHeures.toFixed(1)} h ` +
              `(${dernier.html_url})`
            );

            // Le cron tourne toutes les 24 h : au-delà de 48 h, il est probablement
            // désactivé par GitHub ou en échec répété.
            if (ageHeures <= SEUIL_HEURES) {
              console.log("Ingestion active — rien à signaler.");
              return;
            }

            const titre = "🟠 L'ingestion quotidienne semble arrêtée";
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-arrete",
            });
            if (ouvertes.data.length > 0) {
              console.log("Issue déjà ouverte, rien à faire.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titre,
              labels: ["cron-arrete"],
              body: [
                `Aucune ingestion depuis **${ageHeures.toFixed(0)} heures** ` +
                  `(seuil : ${SEUIL_HEURES} h).`,
                "",
                "GitHub désactive les workflows planifiés après ~60 jours sans",
                "activité sur le dépôt. C'est la cause la plus probable.",
                "",
                "**Réactivation :** *Actions → Ingestion quotidienne → Enable workflow*,",
                "puis *Run workflow* pour rattraper les données manquantes.",
                "",
                `- Dernier run connu : ${dernier.html_url}`,
              ].join("\n"),
            });

      # Réarme le compteur d'inactivité de GitHub : un appel d'API authentifié
      # depuis le dépôt suffit à le considérer comme actif.
      - name: Réarmer le compteur d'activité
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            console.log("Compteur d'inactivité réarmé.");
